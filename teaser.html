            <span class="font-serif text-6xl text-amberfilm/35 leading-none block mb-2">“</span>
            <p class="font-serif italic text-2xl sm:text-[1.65rem] leading-snug text-ivory mb-4">
              Arrancado de su jaula de cristal corporativa, un hombre descubre frente al Caribe que el verdadero cautiverio era la vida que dejó atrás.
            </p>
            <footer class="font-mono text-[11px] uppercase tracking-[0.2em] text-amberfilm">
              — La paradoja central del relato
            </footer>
          </blockquote>

          <!-- Datos de contexto histórico -->
          <div class="mt-8 p-5 rounded-xl bg-slatefilm/70 border hairline flex items-start gap-4">
            <div class="w-10 h-10 rounded-lg bg-atlantic/40 border border-atlanticlight/40 flex items-center justify-center shrink-0 text-amberfilm font-mono text-xs">
              89/90
            </div>
            <div>
              <h3 class="font-mono text-xs uppercase tracking-wider text-ivory mb-1">Contexto Socio-Histórico</h3>
              <p class="text-xs leading-relaxed text-mist">
                La Venezuela bisagra entre décadas: fractura social, ecos de estallidos populares, crisis sanitaria y una ciudad que oscurece mientras el litoral permanece como testigo inmóvil.
              </p>
            </div>
          </div>
        </div>

        <!-- Columna derecha: Narrativa completa -->
        <div class="lg:col-span-7 space-y-6 text-base sm:text-lg font-light leading-[1.85] text-ivory/90 reveal">
          <p class="first-letter:font-serif first-letter:text-6xl first-letter:float-left first-letter:mr-3.5 first-letter:leading-[0.85] first-letter:text-amberfilm">
            En la Caracas caótica y fracturada por los ecos de las protestas populares, <strong class="font-medium text-ivory">Paul White</strong>, un apático e insatisfecho ejecutivo estadounidense de la farmacéutica multinacional <strong class="font-medium text-ivory">Lucerna</strong>, es secuestrado sorpresivamente en su residencia. Sin embargo, la operación no la ejecuta un comando profesional de la guerrilla, sino un improbable trío movido por el resentimiento, la desesperación y la marginalidad: <strong class="font-medium text-ivory">Rafa</strong>, un expromotor médico expulsado de la misma empresa; el <strong class="font-medium text-ivory">Gordo Carlos</strong>, un excéntrico físico y cosmólogo atrapado como profesor de secundaria; y <strong class="font-medium text-ivory">Marleen</strong>, una mujer trans marcada por un pasado desgarrador de violencia.
          </p>

          <p>
            Acompañados en el cautiverio por <strong class="font-medium text-ivory">Etelvina</strong>, una viuda de la costa que custodia al rehén en un escondite frente al Caribe, los captores demandan un millón y medio de dólares, la entrega de alimentos a los barrios vulnerables y la liberación de tratamientos gratuitos contra el VIH. Para legitimarse ante la opinión pública, bautizan su célula como los <span class="text-amberfilm font-normal">«Grupos Organizados por la Liberación de Venezuela» (GOLVE)</span>.
          </p>

          <p>
            Lo que inicia como una extorsión ideológica y de venganza personal pronto desata un terremoto político: el gobierno nacional intenta sofocar el escándalo culpando a extremistas, la Inteligencia Militar desata una cacería implacable, y <strong class="font-medium text-ivory">Arsenio Henríquez</strong>, el desenfrenado presidente regional de Lucerna, intenta encubrir la corrupción de la empresa en medio del pánico. Mientras los detectives <strong class="font-medium text-ivory">Euclides Smith</strong> y <strong class="font-medium text-ivory">Péndulo</strong> arman las piezas de este rompecabezas, dentro de la choza costera ocurre lo inesperado: despojado de sus privilegios corporativos, Paul establece una insólita conexión con Etelvina, descubriendo en su cautiverio una extraña e incipiente paz mientras el cerco policial amenaza con destruirlos a todos.
          </p>

          <!-- Puntos clave del conflicto -->
          <div class="pt-6 border-t hairline grid grid-cols-1 sm:grid-cols-3 gap-4">

              <span class="font-mono text-[10px] uppercase tracking-widest text-amberfilm block mb-1">El Detonante</span>
              <p class="text-xs text-mist leading-relaxed">Un comando amateur inventa una guerrilla ficticia con demandas sanitarias y sociales profundamente reales.</p>
            </div>
            <div class="p-4 rounded-xl bg-slatefilm border hairline">
              <span class="font-mono text-[10px] uppercase tracking-widest text-amberfilm block mb-1">La Cacería</span>
              <p class="text-xs text-mist leading-relaxed">El Estado, la Inteligencia Militar y la cúpula corrupta de Lucerna reaccionan con fuerza desproporcionada.</p>
            </div>
            <div class="p-4 rounded-xl bg-slatefilm border hairline">

  <!-- =====================================================================
       JAVASCRIPT: VIDEO HERO, CANVAS ATMOSFÉRICO, INTERACTIVIDAD Y REVELADO
  ====================================================================== -->
  <script>
    /* -----------------------------------------------------------------------
       1. GESTIÓN DEL VIDEO PORTADA ("peli.mp4") + FALLBACK ATMOSFÉRICO EN CANVAS
    ----------------------------------------------------------------------- */
    const heroVideo = document.getElementById('heroVideo');
    const localVideoInput = document.getElementById('localVideoInput');
    const videoStatusLabel = document.getElementById('videoStatusLabel');

    function revealHeroVideo() {
      heroVideo.classList.remove('opacity-0');
      heroVideo.classList.add('opacity-100');
    }

    // Si peli.mp4 existe y carga fotogramas, mostrarlo suavemente
    heroVideo.addEventListener('loadeddata', () => {
      if (heroVideo.readyState >= 2) {
        revealHeroVideo();
        videoStatusLabel.textContent = 'peli.mp4 activo';
      }
    });

    // Permitir al director cargar su archivo peli.mp4 local para previsualización en vivo
    localVideoInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const objectURL = URL.createObjectURL(file);
      heroVideo.src = objectURL;
      heroVideo.load();
      heroVideo.play().then(() => {
        revealHeroVideo();
        videoStatusLabel.textContent = file.name;
      }).catch(() => {});
    });

    // Canvas atmosférico nocturno (Caracas claroscuro + reflejo marino de La Guaira)
    (function initAtmosphereCanvas() {
      const canvas = document.getElementById('seaAtmosphereCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width, height, animationId;
      let time = 0;

      function resizeCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      function render() {
        time += 0.008;
        ctx.clearRect(0, 0, width, height);

        // Cielo nocturno neo-noir con halo ámbar en el horizonte
        const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
        skyGrad.addColorStop(0, '#08090B');
        skyGrad.addColorStop(0.52, '#0F1820');
        skyGrad.addColorStop(0.64, '#1B3B48');
        skyGrad.addColorStop(1, '#08090B');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, width, height);

        // Resplandor cálido en la línea de horizonte (contrastando ciudad y costa)
        const horizonY = height * 0.62;
        const glowGrad = ctx.createRadialGradient(
          width * 0.5 + Math.sin(time * 0.4) * 40,
          horizonY,
          10,
          width * 0.5,
          horizonY,
          width * 0.55
        );
        glowGrad.addColorStop(0, 'rgba(212, 163, 89, 0.22)');
        glowGrad.addColorStop(0.5, 'rgba(27, 59, 72, 0.14)');
        glowGrad.addColorStop(1, 'rgba(8, 9, 11, 0)');
        ctx.fillStyle = glowGrad;
        ctx.fillRect(0, 0, width, height);

        // Ondas sutiles del mar Caribe bajo el horizonte
        for (let i = 0; i < 14; i++) {
          const progress = i / 14;
          const yBase = horizonY + progress * (height - horizonY);
          ctx.beginPath();
          ctx.strokeStyle = `rgba(212, 163, 89, ${0.03 + (1 - progress) * 0.07})`;
          ctx.lineWidth = 1 + progress * 1.2;

          for (let x = 0; x <= width; x += 24) {
            const wave =
              Math.sin(x * 0.006 + time * (1.2 + progress) + i) * (2 + progress * 5) +
              Math.cos(x * 0.014 - time * 0.8) * 1.5;
            if (x === 0) ctx.moveTo(x, yBase + wave);
            else ctx.lineTo(x, yBase + wave);
          }
          ctx.stroke();
        }

        animationId = requestAnimationFrame(render);
      }

      render();
    })();

    /* -----------------------------------------------------------------------
       2. NAVEGACIÓN GLASSMORPHISM AL HACER SCROLL & MENÚ MÓVIL
    ----------------------------------------------------------------------- */
    const topNav = document.getElementById('topNav');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 40) {

        topNav.classList.remove('border-transparent');
      } else {
        topNav.classList.remove('bg-obsidian/85', 'backdrop-blur-xl', 'border-ivory/10');
        topNav.classList.add('border-transparent');

    /* -----------------------------------------------------------------------
       3. SALA DE PROYECCIÓN & MODAL DE TRÁILER YOUTUBE
    ----------------------------------------------------------------------- */
    const YT_EMBED_URL = 'https://www.youtube.com/embed/qPYaXXnXR_U?rel=0&modestbranding=1&autoplay=1';

    function openTrailerModal() {
      const modal = document.getElementById('trailerModal');
      const frame = document.getElementById('youtubeModalFrame');

      modal.classList.remove('hidden');

    function closeTrailerModal() {
      const modal = document.getElementById('trailerModal');
      const frame = document.getElementById('youtubeModalFrame');
      frame.src = '';
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      document.body.style.overflow = '';
    }

    function toggleCinemaLights(forceState) {
      const body = document.body;
      const btnText = document.getElementById('cinemaLightsText');
      const shouldTurnOff = typeof forceState === 'boolean'
        ? forceState
        : !body.classList.contains('cinema-lights-off');

      if (shouldTurnOff) {
        body.classList.add('cinema-lights-off');
        btnText.textContent = 'Encender Luces';
      } else {
        body.classList.remove('cinema-lights-off');
        btnText.textContent = 'Modo Sala Oscura';

    }

    /* -----------------------------------------------------------------------
       4. FILTRO DE PERSONAJES (DRAMATIS PERSONAE)
    ----------------------------------------------------------------------- */
    function filterCharacters(group, btnElement) {
      document.querySelectorAll('.char-filter-btn').forEach((btn) => {
        btn.classList.remove('bg-amberfilm', 'text-obsidian');
        btn.classList.add('bg-obsidian/70', 'text-mist');
      });
      btnElement.classList.remove('bg-obsidian/70', 'text-mist');
      btnElement.classList.add('bg-amberfilm', 'text-obsidian');

      document.querySelectorAll('.char-card').forEach((card) => {
        if (group === 'all' || card.dataset.group === group) {
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });
    }

    function selectAct(actNumber) {
      [1, 2, 3].forEach((num) => {
        const btn = document.getElementById(`actBtn${num}`);
        const kicker = btn.querySelector('span:first-child');
        if (num === actNumber) {
          btn.classList.remove('border-ivory/10', 'bg-slatefilm/50');
          btn.classList.add('border-amberfilm', 'bg-slatefilm');
          kicker.classList.remove('text-mist');
          kicker.classList.add('text-amberfilm');
        } else {
          btn.classList.remove('border-amberfilm', 'bg-slatefilm');
          btn.classList.add('border-ivory/10', 'bg-slatefilm/50');
          kicker.classList.remove('text-amberfilm');
          kicker.classList.add('text-mist');
        }
      });

      const data = actsData[actNumber];
      const panel = document.getElementById('actDisplayPanel');
      panel.innerHTML = `

    /* -----------------------------------------------------------------------
       6. COPIAR RESUMEN EJECUTIVO (ONE-SHEET) Y MODAL DE CONTACTO
    ----------------------------------------------------------------------- */
    function copyPitchSummary() {
      const pitchText = [
        'EL MAR QUE ME REGALAS — DOSSIER CINEMATOGRÁFICO',
        'Presentado por: Barbarie Entertainment',
        'Obra original: Adaptación cinematográfica de la novela homónima de Jorge Rodríguez Gómez',
        'Género: Thriller Político / Drama Psicológico / Cine Negro (Neo-noir)',
        'Formato: Largometraje de ficción (115 min est.)',
        'Ambientación: Caracas y costas de La Guaira, Venezuela (finales de los 80 / principios de los 90)',
        'Logline: En la Caracas fracturada de finales de los 80, un secuestro improvisado desata una cacería de Estado; frente al mar Caribe, el cautiverio se convierte en la única libertad posible.',
        'Tráiler Oficial: https://youtu.be/qPYaXXnXR_U'
      ].join('\n');

      const tempInput = document.createElement('textarea');
      tempInput.value = pitchText;
      document.body.appendChild(tempInput);
      tempInput.select();
      try {
        document.execCommand('copy');
        const feedback = document.getElementById('copyFeedback');
        feedback.classList.remove('opacity-0');
        setTimeout(() => feedback.classList.add('opacity-0'), 3500);
      } catch (err) {
        // Fallback silencioso
      }
      document.body.removeChild(tempInput);
    }

    function openContactModal() {
      const modal = document.getElementById('contactModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.body.style.overflow = 'hidden';
    }

    function closeContactModal() {
      const modal = document.getElementById('contactModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      document.body.style.overflow = '';
    }

    function handleProducerSubmit(e) {
      e.preventDefault();
      document.getElementById('formSuccessBox').classList.remove('hidden');
      e.target.reset();
    }

    // Cerrar modales con tecla Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeTrailerModal();
        closeContactModal();
        toggleCinemaLights(false);
      }
    });

    /* -----------------------------------------------------------------------
       7. ANIMACIONES DE REVELADO AL HACER SCROLL (INTERSECTION OBSERVER)
    ----------------------------------------------------------------------- */
    document.addEventListener('DOMContentLoaded', () => {
      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            }
          });
        },
        { threshold: 0.12 }
      );

      document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));
    });
  </script>
