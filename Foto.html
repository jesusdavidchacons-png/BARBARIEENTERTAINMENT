<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Venezuela Abierta al Futuro • Photo Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090b0e;
      --surface: #131720;
      --accent: #f59e0b;
      --accent-hover: #fbbf24;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', system-ui, -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border-radius: 28px;
      padding: 22px;
      border: 1px solid var(--border);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 1.28rem;
      font-weight: 700;
      margin-bottom: 14px;
      line-height: 1.3;
    }
    .selectors {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-bottom: 14px;
    }
    .pill-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: rgba(0, 0, 0, 0.35);
      padding: 4px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .pill {
      padding: 10px 8px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .pill.active {
      background: var(--accent);
      color: #000;
    }
    .frame {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      transition: aspect-ratio 0.25s ease;
    }
    .frame.group-ratio { aspect-ratio: 4 / 3; }
    video, img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    video.mirror { transform: scaleX(-1); }
    .cam-switcher-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }
    .cam-chip {
      background: rgba(9, 11, 14, 0.82);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      padding: 7px 13px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      max-width: 210px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cam-chip.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--muted);
      font-size: 0.9rem;
      gap: 10px;
    }
    .placeholder svg {
      width: 44px;
      height: 44px;
      stroke: var(--accent);
      opacity: 0.85;
    }
    .hidden { display: none !important; }
    .countdown {
      position: absolute;
      inset: 0;
      z-index: 15;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5.5rem;
      font-weight: 800;
      color: #fff;
    }
    .loader {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: rgba(9, 11, 14, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.12);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .dual-btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-main {
      width: 100%;
      padding: 15px 12px;
      border: none;
      border-radius: 14px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
      background: var(--accent);
      color: #000;
    }
    .btn-main:active { transform: scale(0.98); }
    .btn-main:hover { background: var(--accent-hover); }
    .btn-usb {
      background: #10b981;
      color: #000;
    }
    .btn-usb:hover {
      background: #34d399;
    }
    .btn-secondary {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 14px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }
    .hint-text {
      font-size: 0.76rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .error-msg {
      color: #f87171;
      font-size: 0.85rem;
      margin-top: 10px;
      line-height: 1.4;
      word-break: break-word;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="badge">Venezuela • Abierta al Futuro</div>
  <h1 id="heading">Elige tu encuadre y destino</h1>

  <div id="selectors" class="selectors">
    <div class="pill-group">
      <button type="button" class="pill active" id="mode-selfie" onclick="setMode('selfie')">Selfie (Individual)</button>
      <button type="button" class="pill" id="mode-group" onclick="setMode('group')">Foto Grupal</button>
    </div>

    <div class="pill-group">
      <button type="button" class="pill active" id="dest-medanos" onclick="setDestination('medanos')">Médanos de Coro</button>
      <button type="button" class="pill" id="dest-salto" onclick="setDestination('salto')">Salto Ángel</button>
    </div>
  </div>

  <div id="frame" class="frame">
    <!-- Barra dinámica con todas las cámaras detectadas (Interna, DJI Osmo Action / USB, etc.) -->
    <div id="cam-switcher-bar" class="cam-switcher-bar hidden"></div>

    <div id="placeholder" class="placeholder">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z" />
      </svg>
      <span>Elige la cámara que deseas activar</span>
    </div>

    <video id="video" autoplay playsinline muted class="hidden"></video>
    <img id="result-img" class="hidden" alt="Resultado">
    <div id="countdown" class="countdown hidden">3</div>

    <div id="loader" class="loader hidden">
      <div class="spinner"></div>
      <p id="loader-text">Integrando tu foto...</p>
    </div>
  </div>

  <!-- Paso 1: Botones para elegir Cámara Interna o Cámara USB (Action) -->
  <div id="ui-start" class="actions">
    <div class="dual-btn-row">
      <button type="button" class="btn-main" onclick="startWithMode('internal')">Cámara Interna</button>
      <button type="button" class="btn-main btn-usb" onclick="startWithMode('usb')">Cámara USB (Action)</button>
    </div>
  </div>

  <!-- Paso 2 -->
  <div id="ui-camera" class="actions hidden">
    <button type="button" class="btn-main" onclick="startCountdown()">Tomar Foto</button>
  </div>

  <!-- Paso 3 -->
  <div id="ui-preview" class="actions hidden">
    <button type="button" id="generate-btn" class="btn-main" onclick="processImage()">Crear Póster en Médanos de Coro</button>
    <button type="button" class="btn-secondary" onclick="retakePhoto()">Repetir Foto</button>
  </div>

  <!-- Paso 4 -->
  <div id="ui-done" class="actions hidden">
    <button type="button" class="btn-main" onclick="saveToGallery()">Guardar Póster en Galería</button>
    <p class="hint-text">En iPhone/Android toca "Guardar imagen" para enviarlo directo a Fotos</p>
    <button type="button" class="btn-secondary" onclick="resetExperience()">Crear Otro Póster</button>
  </div>

  <p id="error-box" class="error-msg hidden"></p>
</div>

<canvas id="canvas" class="hidden"></canvas>

<script>
  const WORKER_URL = "https://barbarieentertainment.jesusdavid-chacons.workers.dev";
  const LOGO_PATH = "./marcapais.png";

  // Modelo rápido de alta calidad (Nano Banana Flash) + salida 2K
  const FAST_MODEL_CONFIG = {
    model: "gemini-2.5-flash-image",
    resolution: "2K"
  };

  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const resultImg = document.getElementById("result-img");
  const placeholder = document.getElementById("placeholder");
  const countdownEl = document.getElementById("countdown");
  const loader = document.getElementById("loader");
  const loaderText = document.getElementById("loader-text");
  const errorBox = document.getElementById("error-box");
  const heading = document.getElementById("heading");
  const frame = document.getElementById("frame");
  const generateBtn = document.getElementById("generate-btn");
  const selectors = document.getElementById("selectors");
  const camSwitcherBar = document.getElementById("cam-switcher-bar");

  let selectedMode = "selfie";
  let selectedDestination = "medanos";
  let isMirrored = false;
  let currentStream = null;
  let capturedDataUrl = null;
  let generatedDataUrl = null;

  function setMode(mode) {
    selectedMode = mode;
    document.getElementById("mode-selfie").classList.toggle("active", mode === "selfie");
    document.getElementById("mode-group").classList.toggle("active", mode === "group");
    frame.classList.toggle("group-ratio", mode === "group");
  }

  function setDestination(dest) {
    selectedDestination = dest;
    document.getElementById("dest-medanos").classList.toggle("active", dest === "medanos");
    document.getElementById("dest-salto").classList.toggle("active", dest === "salto");
    const destName = dest === "salto" ? "Salto Ángel" : "Médanos de Coro";
    generateBtn.textContent = `Crear Póster en ${destName}`;
  }

  function setStep(step) {
    ["ui-start", "ui-camera", "ui-preview", "ui-done"].forEach(id => {
      document.getElementById(id).classList.add("hidden");
    });
    document.getElementById(step).classList.remove("hidden");
    selectors.classList.toggle("hidden", step === "ui-done");
    camSwitcherBar.classList.toggle("hidden", step !== "ui-camera");
    errorBox.classList.add("hidden");
  }

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.remove("hidden");
  }

  function stopCurrentStream() {
    if (currentStream) {
      currentStream.getTracks().forEach(track => track.stop());
      currentStream = null;
    }
  }

  function formatLabel(device, index) {
    const raw = (device.label || "").trim();
    if (!raw) return `Cámara ${index + 1}`;
    const lower = raw.toLowerCase();
    if (lower.includes("osmo") || lower.includes("dji")) return "DJI Osmo Action";
    if (lower.includes("usb") || lower.includes("uvc") || lower.includes("external")) return "Cámara USB";
    if (lower.includes("front") || lower.includes("user")) return "Cámara Frontal";
    if (lower.includes("back") || lower.includes("environment")) return "Cámara Trasera";
    return raw.replace(/\s*\([0-9a-f]{4}:[0-9a-f]{4}\)\s*/i, "");
  }

  function isUsbOrExternal(device) {
    const l = (device.label || "").toLowerCase();
    return l.includes("usb") || l.includes("osmo") || l.includes("dji") ||
           l.includes("uvc") || l.includes("webcam") || l.includes("external") ||
           l.includes("camera 1") || l.includes("back") || l.includes("environment");
  }

  async function renderCameraChips(activeDeviceId) {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const videoInputs = devices.filter(d => d.kind === "videoinput");

    camSwitcherBar.innerHTML = "";
    if (videoInputs.length <= 1) return;

    videoInputs.forEach((dev, idx) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "cam-chip" + (dev.deviceId === activeDeviceId ? " active" : "");
      btn.textContent = formatLabel(dev, idx);
      btn.onclick = () => openSpecificCamera(dev.deviceId, !isUsbOrExternal(dev));
      camSwitcherBar.appendChild(btn);
    });
  }

  async function openSpecificCamera(deviceId, mirrorFlag = false) {
    stopCurrentStream();

    const constraintsList = [
      {
        video: {
          deviceId: { exact: deviceId },
          width: { ideal: 1920 },
          height: { ideal: 1080 },
          frameRate: { ideal: 30, max: 30 }
        },
        audio: false
      },
      {
        video: { deviceId: { exact: deviceId } },
        audio: false
      }
    ];

    let stream = null;
    for (const c of constraintsList) {
      try {
        stream = await navigator.mediaDevices.getUserMedia(c);
        break;
      } catch (err) {
        // Intenta el siguiente constraint
      }
    }

    if (!stream) {
      throw new Error("No se pudo iniciar la transmisión de la cámara seleccionada.");
    }

    currentStream = stream;
    isMirrored = mirrorFlag;
    video.srcObject = currentStream;
    video.classList.toggle("mirror", isMirrored);
    await video.play().catch(() => {});

    const activeTrack = currentStream.getVideoTracks()[0];
    const activeId = activeTrack?.getSettings?.()?.deviceId || deviceId;
    await renderCameraChips(activeId);

    placeholder.classList.add("hidden");
    resultImg.classList.add("hidden");
    video.classList.remove("hidden");
    setStep("ui-camera");
  }

  async function startWithMode(mode) {
    try {
      stopCurrentStream();

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showError("El navegador bloqueó la cámara. Abre esta web con HTTPS (no como archivo local).");
        return;
      }

      const initialStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      const devices = await navigator.mediaDevices.enumerateDevices();
      const videoInputs = devices.filter(d => d.kind === "videoinput");

      if (videoInputs.length === 0) {
        initialStream.getTracks().forEach(t => t.stop());
        showError("No se detectó ninguna cámara conectada.");
        return;
      }

      let chosenDevice = null;
      if (mode === "usb") {
        chosenDevice = videoInputs.find(isUsbOrExternal) || videoInputs[videoInputs.length - 1];
      } else {
        chosenDevice = videoInputs.find(d => !isUsbOrExternal(d)) || videoInputs[0];
      }

      const initialTrackId = initialStream.getVideoTracks()[0]?.getSettings?.()?.deviceId;

      if (chosenDevice.deviceId === initialTrackId && mode === "internal") {
        currentStream = initialStream;
        isMirrored = true;
        video.srcObject = currentStream;
        video.classList.add("mirror");
        await video.play().catch(() => {});
        await renderCameraChips(initialTrackId);

        placeholder.classList.add("hidden");
        resultImg.classList.add("hidden");
        video.classList.remove("hidden");
        setStep("ui-camera");
      } else {
        initialStream.getTracks().forEach(t => t.stop());
        await openSpecificCamera(chosenDevice.deviceId, mode === "internal");
      }
    } catch (e) {
      if (e.name === "NotAllowedError") {
        showError("Permiso denegado. Habilita la cámara en los ajustes de Chrome/Android.");
      } else if (e.name === "NotReadableError") {
        showError("Cámara ocupada por otra app (cierra la app Cámara de Android en segundo plano).");
      } else {
        showError(`Error (${e.name || "Cámara"}): ${e.message}`);
      }
    }
  }

  function startCountdown() {
    let sec = 3;
    countdownEl.textContent = sec;
    countdownEl.classList.remove("hidden");

    const timer = setInterval(() => {
      sec--;
      if (sec > 0) {
        countdownEl.textContent = sec;
      } else {
        clearInterval(timer);
        countdownEl.classList.add("hidden");
        capture();
      }
    }, 1000);
  }

  function capture() {
    const targetRatio = selectedMode === "group" ? 4 / 3 : 3 / 4;
    const vw = video.videoWidth || 1280;
    const vh = video.videoHeight || 720;
    const videoRatio = vw / vh;

    let sx = 0, sy = 0, sw = vw, sh = vh;
    if (videoRatio > targetRatio) {
      sw = vh * targetRatio;
      sx = (vw - sw) / 2;
    } else {
      sh = vw / targetRatio;
      sy = (vh - sh) / 2;
    }

    // 1024px agiliza la subida sin perder nitidez facial para el modelo 2K
    const maxDim = 1024;
    if (sw >= sh) {
      canvas.width = Math.min(maxDim, sw);
      canvas.height = canvas.width / targetRatio;
    } else {
      canvas.height = Math.min(maxDim, sh);
      canvas.width = canvas.height * targetRatio;
    }

    const ctx = canvas.getContext("2d");
    ctx.save();
    if (isMirrored) {
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
    }
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    ctx.restore();

    capturedDataUrl = canvas.toDataURL("image/jpeg", 0.85);
    resultImg.src = capturedDataUrl;

    video.classList.add("hidden");
    resultImg.classList.remove("hidden");
    setStep("ui-preview");
  }

  function retakePhoto() {
    resultImg.classList.add("hidden");
    video.classList.remove("hidden");
    setStep("ui-camera");
  }

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => resolve(img);
      img.onerror = (e) => reject(e);
      img.src = src;
    });
  }

  function drawSpacedText(ctx, text, x, y, spacing) {
    const chars = text.split("");
    const totalWidth = chars.reduce((acc, ch) => acc + ctx.measureText(ch).width, 0) + spacing * (chars.length - 1);
    let currentX = x - totalWidth / 2;
    for (const ch of chars) {
      ctx.fillText(ch, currentX + ctx.measureText(ch).width / 2, y);
      currentX += ctx.measureText(ch).width + spacing;
    }
  }

  async function composeMoviePoster(baseImageDataUrl, destination) {
    await document.fonts.ready;

    const baseImg = await loadImage(baseImageDataUrl);
    const posterCanvas = document.createElement("canvas");
    posterCanvas.width = baseImg.width;
    posterCanvas.height = baseImg.height;
    const ctx = posterCanvas.getContext("2d");

    ctx.drawImage(baseImg, 0, 0);

    const w = posterCanvas.width;
    const h = posterCanvas.height;

    const bottomGrad = ctx.createLinearGradient(0, h * 0.58, 0, h);
    bottomGrad.addColorStop(0, "rgba(0, 0, 0, 0)");
    bottomGrad.addColorStop(0.5, "rgba(0, 0, 0, 0.62)");
    bottomGrad.addColorStop(1, "rgba(0, 0, 0, 0.94)");
    ctx.fillStyle = bottomGrad;
    ctx.fillRect(0, h * 0.58, w, h * 0.42);

    const titleText = destination === "salto" ? "SALTO ÁNGEL" : "MÉDANOS DE CORO";
    const taglineText = destination === "salto"
      ? "PARQUE NACIONAL CANAIMA • VENEZUELA"
      : "ESTADO FALCÓN • VENEZUELA";

    ctx.textAlign = "center";
    const titleSize = Math.round(w * 0.066);
    ctx.font = `800 ${titleSize}px 'Cinzel', Georgia, serif`;
    const titleGrad = ctx.createLinearGradient(0, h - h * 0.18, 0, h - h * 0.12);
    titleGrad.addColorStop(0, "#ffffff");
    titleGrad.addColorStop(0.7, "#f1f5f9");
    titleGrad.addColorStop(1, "#fbbf24");
    ctx.fillStyle = titleGrad;
    ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
    ctx.shadowBlur = 18;
    drawSpacedText(ctx, titleText, w / 2, h - h * 0.136, Math.round(w * 0.005));
    ctx.shadowBlur = 0;

    ctx.fillStyle = "rgba(245, 158, 11, 0.95)";
    const subSize = Math.round(w * 0.018);
    ctx.font = `700 ${subSize}px 'Montserrat', sans-serif`;
    drawSpacedText(ctx, taglineText, w / 2, h - h * 0.105, Math.round(w * 0.004));

    try {
      const logoImg = await loadImage(LOGO_PATH);
      const maxLogoW = w * 0.34;
      const maxLogoH = h * 0.075;
      const ratio = Math.min(maxLogoW / logoImg.width, maxLogoH / logoImg.height);
      const drawW = logoImg.width * ratio;
      const drawH = logoImg.height * ratio;
      const drawX = (w - drawW) / 2;
      const drawY = h - drawH - (h * 0.022);

      ctx.drawImage(logoImg, drawX, drawY, drawW, drawH);
    } catch (e) {
      console.warn("No se encontró marcapais.png:", e);
    }

    return posterCanvas.toDataURL("image/jpeg", 0.92);
  }

  async function processImage() {
    const destName = selectedDestination === "salto" ? "el Salto Ángel" : "Los Médanos de Coro";
    loaderText.textContent = `Integrando escena en ${destName}...`;
    loader.classList.remove("hidden");
    errorBox.classList.add("hidden");

    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          image: capturedDataUrl,
          mode: selectedMode,
          destination: selectedDestination,
          model: FAST_MODEL_CONFIG.model,
          resolution: FAST_MODEL_CONFIG.resolution
        })
      });

      const data = await res.json();

      if (!res.ok || !data.image) {
        throw new Error(data.error || "Error al generar la foto");
      }

      generatedDataUrl = await composeMoviePoster(data.image, selectedDestination);
      resultImg.src = generatedDataUrl;
      heading.textContent = `¡Tu Póster en ${destName}!`;
      setStep("ui-done");
    } catch (err) {
      showError("Error: " + err.message);
    } finally {
      loader.classList.add("hidden");
    }
  }

  async function saveToGallery() {
    if (!generatedDataUrl) return;
    const filename = `poster-venezuela-${selectedDestination}-${selectedMode}.jpg`;

    try {
      const response = await fetch(generatedDataUrl);
      const blob = await response.blob();
      const file = new File([blob], filename, { type: "image/jpeg" });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({
          files: [file],
          title: "Venezuela Abierta al Futuro"
        });
        return;
      }
    } catch (err) {
      if (err.name === "AbortError") return;
    }

    const a = document.createElement("a");
    a.href = generatedDataUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  function resetExperience() {
    heading.textContent = "Elige tu encuadre y destino";
    resultImg.classList.add("hidden");
    video.classList.remove("hidden");
    setStep("ui-camera");
  }
</script>

</body>
</html>
