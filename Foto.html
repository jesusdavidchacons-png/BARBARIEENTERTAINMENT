<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Venezuela Abierta al Futuro • Photo Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090b0e;
      --surface: #131720;
      --accent: #f59e0b;
      --accent-hover: #fbbf24;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', system-ui, -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border-radius: 28px;
      padding: 22px;
      border: 1px solid var(--border);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 1.28rem;
      font-weight: 700;
      margin-bottom: 14px;
      line-height: 1.3;
    }
    .selectors {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-bottom: 14px;
    }
    .pill-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: rgba(0, 0, 0, 0.35);
      padding: 4px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .pill {
      padding: 10px 8px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .pill.active {
      background: var(--accent);
      color: #000;
    }
    .frame {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      transition: aspect-ratio 0.25s ease;
    }
    .frame.group-ratio { aspect-ratio: 4 / 3; }
    video, img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    video.mirror { transform: scaleX(-1); }
    .switch-cam-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
      background: rgba(9, 11, 14, 0.72);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      max-width: calc(100% - 24px);
    }
    .switch-cam-btn span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }
    .switch-cam-btn:active { transform: scale(0.95); }
    .switch-cam-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      stroke: var(--accent);
    }
    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--muted);
      font-size: 0.9rem;
      gap: 10px;
    }
    .placeholder svg {
      width: 44px;
      height: 44px;
      stroke: var(--accent);
      opacity: 0.85;
    }
    .hidden { display: none !important; }
    .countdown {
      position: absolute;
      inset: 0;
      z-index: 15;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5.5rem;
      font-weight: 800;
      color: #fff;
    }
    .loader {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: rgba(9, 11, 14, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.12);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-main {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
      background: var(--accent);
      color: #000;
    }
    .btn-main:active { transform: scale(0.98); }
    .btn-main:hover { background: var(--accent-hover); }
    .btn-secondary {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 14px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }
    .hint-text {
      font-size: 0.76rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .error-msg {
      color: #f87171;
      font-size: 0.85rem;
      margin-top: 8px;
      word-break: break-word;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="badge">Venezuela • Abierta al Futuro</div>
  <h1 id="heading">Elige tu encuadre y destino</h1>

  <div id="selectors" class="selectors">
    <!-- Selector 1: Selfie vs Grupal -->
    <div class="pill-group">
      <button type="button" class="pill active" id="mode-selfie" onclick="setMode('selfie')">Selfie (Individual)</button>
      <button type="button" class="pill" id="mode-group" onclick="setMode('group')">Foto Grupal</button>
    </div>

    <!-- Selector 2: Destino -->
    <div class="pill-group">
      <button type="button" class="pill active" id="dest-medanos" onclick="setDestination('medanos')">Médanos de Coro</button>
      <button type="button" class="pill" id="dest-salto" onclick="setDestination('salto')">Salto Ángel</button>
    </div>
  </div>

  <div id="frame" class="frame">
    <button type="button" id="switch-cam-btn" class="switch-cam-btn hidden" onclick="toggleCamera()">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
      </svg>
      <span id="cam-label">Cambiar Cámara</span>
    </button>

    <div id="placeholder" class="placeholder">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z" />
      </svg>
      <span>Activa tu cámara para comenzar</span>
    </div>

    <video id="video" autoplay playsinline class="hidden mirror"></video>
    <img id="result-img" class="hidden" alt="Resultado">
    <div id="countdown" class="countdown hidden">3</div>

    <div id="loader" class="loader hidden">
      <div class="spinner"></div>
      <p id="loader-text">Integrando tu foto...</p>
    </div>
  </div>

  <!-- Paso 1 -->
  <div id="ui-start" class="actions">
    <button class="btn-main" onclick="initCamera()">Activar Cámara</button>
  </div>

  <!-- Paso 2 -->
  <div id="ui-camera" class="actions hidden">
    <button class="btn-main" onclick="startCountdown()">Tomar Foto</button>
  </div>

  <!-- Paso 3 -->
  <div id="ui-preview" class="actions hidden">
    <button id="generate-btn" class="btn-main" onclick="processImage()">Crear Póster en Médanos de Coro</button>
    <button class="btn-secondary" onclick="retakePhoto()">Repetir Foto</button>
  </div>

  <!-- Paso 4 -->
  <div id="ui-done" class="actions hidden">
    <button class="btn-main" onclick="saveToGallery()">Guardar Póster en Galería</button>
    <p class="hint-text">En iPhone/Android toca "Guardar imagen" para enviarlo directo a Fotos</p>
    <button class="btn-secondary" onclick="resetExperience()">Crear Otro Póster</button>
  </div>

  <p id="error-box" class="error-msg hidden"></p>
</div>

<canvas id="canvas" class="hidden"></canvas>

<script>
  const WORKER_URL = "https://barbarieentertainment.jesusdavid-chacons.workers.dev";
  const LOGO_PATH = "./marcapais.png";

  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const resultImg = document.getElementById("result-img");
  const placeholder = document.getElementById("placeholder");
  const countdownEl = document.getElementById("countdown");
  const loader = document.getElementById("loader");
  const loaderText = document.getElementById("loader-text");
  const errorBox = document.getElementById("error-box");
  const heading = document.getElementById("heading");
  const frame = document.getElementById("frame");
  const generateBtn = document.getElementById("generate-btn");
  const selectors = document.getElementById("selectors");
  const switchCamBtn = document.getElementById("switch-cam-btn");
  const camLabel = document.getElementById("cam-label");

  let selectedMode = "selfie";
  let selectedDestination = "medanos";
  let videoDevices = [];
  let currentDeviceIndex = 0;
  let isMirrored = true;
  let currentStream = null;
  let capturedDataUrl = null;
  let generatedDataUrl = null;

  function setMode(mode) {
    selectedMode = mode;
    document.getElementById("mode-selfie").classList.toggle("active", mode === "selfie");
    document.getElementById("mode-group").classList.toggle("active", mode === "group");
    frame.classList.toggle("group-ratio", mode === "group");
  }

  function setDestination(dest) {
    selectedDestination = dest;
    document.getElementById("dest-medanos").classList.toggle("active", dest === "medanos");
    document.getElementById("dest-salto").classList.toggle("active", dest === "salto");
    const destName = dest === "salto" ? "Salto Ángel" : "Médanos de Coro";
    generateBtn.textContent = `Crear Póster en ${destName}`;
  }

  function setStep(step) {
    ["ui-start", "ui-camera", "ui-preview", "ui-done"].forEach(id => {
      document.getElementById(id).classList.add("hidden");
    });
    document.getElementById(step).classList.remove("hidden");
    selectors.classList.toggle("hidden", step === "ui-done");
    switchCamBtn.classList.toggle("hidden", step !== "ui-camera" || videoDevices.length <= 1);
    errorBox.classList.add("hidden");
  }

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.remove("hidden");
  }

  function formatCameraName(device, index) {
    if (!device || !device.label) return `Cámara ${index + 1}`;
    const label = device.label.toLowerCase();
    if (label.includes("front") || label.includes("user") || label.includes("frontal")) return "Cámara Selfie";
    if (label.includes("back") || label.includes("environment") || label.includes("trasera")) return "Cámara Trasera";
    // Limpia el ID de hardware entre paréntesis en PC (ej. "Logitech HD Webcam (046d:0825)" -> "Logitech HD Webcam")
    return device.label.replace(/\s*\([0-9a-f]{4}:[0-9a-f]{4}\)\s*/i, "").trim();
  }

  function checkShouldMirror(track) {
    const settings = track.getSettings ? track.getSettings() : {};
    if (settings.facingMode === "environment") return false;
    if (settings.facingMode === "user") return true;

    const label = (track.label || "").toLowerCase();
    if (label.includes("back") || label.includes("environment") || label.includes("trasera") || label.includes("rear")) {
      return false;
    }
    return true;
  }

  async function refreshVideoDevices(activeTrack) {
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      videoDevices = devices.filter(d => d.kind === "videoinput");

      const currentDeviceId = activeTrack?.getSettings?.()?.deviceId;
      if (currentDeviceId && videoDevices.length > 0) {
        const foundIdx = videoDevices.findIndex(d => d.deviceId === currentDeviceId);
        if (foundIdx !== -1) currentDeviceIndex = foundIdx;
      }

      if (videoDevices.length > 1) {
        const nextIndex = (currentDeviceIndex + 1) % videoDevices.length;
        camLabel.textContent = formatCameraName(videoDevices[nextIndex], nextIndex);
      }
    } catch (err) {
      console.warn("No se pudieron listar cámaras:", err);
    }
  }

  async function initCamera(deviceId = null) {
    try {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const videoConstraints = {
        width: { ideal: 1280 },
        height: { ideal: 1280 }
      };

      if (deviceId) {
        videoConstraints.deviceId = { exact: deviceId };
      } else {
        videoConstraints.facingMode = { ideal: "user" };
      }

      currentStream = await navigator.mediaDevices.getUserMedia({
        video: videoConstraints,
        audio: false
      });

      const activeTrack = currentStream.getVideoTracks()[0];
      await refreshVideoDevices(activeTrack);

      isMirrored = checkShouldMirror(activeTrack);
      video.srcObject = currentStream;
      video.classList.toggle("mirror", isMirrored);

      placeholder.classList.add("hidden");
      resultImg.classList.add("hidden");
      video.classList.remove("hidden");
      setStep("ui-camera");
    } catch (e) {
      showError("No se pudo abrir la cámara. Verifica los permisos del navegador o que no esté en uso por otra app.");
    }
  }

  function toggleCamera() {
    if (videoDevices.length <= 1) return;
    currentDeviceIndex = (currentDeviceIndex + 1) % videoDevices.length;
    initCamera(videoDevices[currentDeviceIndex].deviceId);
  }

  function startCountdown() {
    let sec = 3;
    countdownEl.textContent = sec;
    countdownEl.classList.remove("hidden");

    const timer = setInterval(() => {
      sec--;
      if (sec > 0) {
        countdownEl.textContent = sec;
      } else {
        clearInterval(timer);
        countdownEl.classList.add("hidden");
        capture();
      }
    }, 1000);
  }

  function capture() {
    const targetRatio = selectedMode === "group" ? 4 / 3 : 3 / 4;
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    const videoRatio = vw / vh;

    let sx = 0, sy = 0, sw = vw, sh = vh;
    if (videoRatio > targetRatio) {
      sw = vh * targetRatio;
      sx = (vw - sw) / 2;
    } else {
      sh = vw / targetRatio;
      sy = (vh - sh) / 2;
    }

    const maxDim = 1152;
    if (sw >= sh) {
      canvas.width = Math.min(maxDim, sw);
      canvas.height = canvas.width / targetRatio;
    } else {
      canvas.height = Math.min(maxDim, sh);
      canvas.width = canvas.height * targetRatio;
    }

    const ctx = canvas.getContext("2d");
    ctx.save();
    if (isMirrored) {
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
    }
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    ctx.restore();

    capturedDataUrl = canvas.toDataURL("image/jpeg", 0.9);
    resultImg.src = capturedDataUrl;

    video.classList.add("hidden");
    resultImg.classList.remove("hidden");
    setStep("ui-preview");
  }

  function retakePhoto() {
    resultImg.classList.add("hidden");
    video.classList.remove("hidden");
    setStep("ui-camera");
  }

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => resolve(img);
      img.onerror = (e) => reject(e);
      img.src = src;
    });
  }

  function drawSpacedText(ctx, text, x, y, spacing) {
    const chars = text.split("");
    const totalWidth = chars.reduce((acc, ch) => acc + ctx.measureText(ch).width, 0) + spacing * (chars.length - 1);
    let currentX = x - totalWidth / 2;
    for (const ch of chars) {
      ctx.fillText(ch, currentX + ctx.measureText(ch).width / 2, y);
      currentX += ctx.measureText(ch).width + spacing;
    }
  }

  async function composeMoviePoster(baseImageDataUrl, destination) {
    await document.fonts.ready;

    const baseImg = await loadImage(baseImageDataUrl);
    const posterCanvas = document.createElement("canvas");
    posterCanvas.width = baseImg.width;
    posterCanvas.height = baseImg.height;
    const ctx = posterCanvas.getContext("2d");

    // 1. Foto a sangre completa
    ctx.drawImage(baseImg, 0, 0);

    const w = posterCanvas.width;
    const h = posterCanvas.height;

    // 2. Degradado inferior cinematográfico
    const bottomGrad = ctx.createLinearGradient(0, h * 0.58, 0, h);
    bottomGrad.addColorStop(0, "rgba(0, 0, 0, 0)");
    bottomGrad.addColorStop(0.5, "rgba(0, 0, 0, 0.62)");
    bottomGrad.addColorStop(1, "rgba(0, 0, 0, 0.94)");
    ctx.fillStyle = bottomGrad;
    ctx.fillRect(0, h * 0.58, w, h * 0.42);

    // 3. Título del destino y subtítulo
    const titleText = destination === "salto" ? "SALTO ÁNGEL" : "MÉDANOS DE CORO";
    const taglineText = destination === "salto"
      ? "PARQUE NACIONAL CANAIMA • VENEZUELA"
      : "ESTADO FALCÓN • VENEZUELA";

    ctx.textAlign = "center";
    const titleSize = Math.round(w * 0.066);
    ctx.font = `800 ${titleSize}px 'Cinzel', Georgia, serif`;
    const titleGrad = ctx.createLinearGradient(0, h - h * 0.18, 0, h - h * 0.12);
    titleGrad.addColorStop(0, "#ffffff");
    titleGrad.addColorStop(0.7, "#f1f5f9");
    titleGrad.addColorStop(1, "#fbbf24");
    ctx.fillStyle = titleGrad;
    ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
    ctx.shadowBlur = 18;
    drawSpacedText(ctx, titleText, w / 2, h - h * 0.136, Math.round(w * 0.005));
    ctx.shadowBlur = 0;

    ctx.fillStyle = "rgba(245, 158, 11, 0.95)";
    const subSize = Math.round(w * 0.018);
    ctx.font = `700 ${subSize}px 'Montserrat', sans-serif`;
    drawSpacedText(ctx, taglineText, w / 2, h - h * 0.105, Math.round(w * 0.004));

    // 4. Estampar marcapais.png
    try {
      const logoImg = await loadImage(LOGO_PATH);
      const maxLogoW = w * 0.34;
      const maxLogoH = h * 0.075;
      const ratio = Math.min(maxLogoW / logoImg.width, maxLogoH / logoImg.height);
      const drawW = logoImg.width * ratio;
      const drawH = logoImg.height * ratio;
      const drawX = (w - drawW) / 2;
      const drawY = h - drawH - (h * 0.022);

      ctx.drawImage(logoImg, drawX, drawY, drawW, drawH);
    } catch (e) {
      console.warn("No se encontró marcapais.png en la raíz del repositorio:", e);
    }

    return posterCanvas.toDataURL("image/jpeg", 0.94);
  }

  async function processImage() {
    const destName = selectedDestination === "salto" ? "el Salto Ángel" : "Los Médanos de Coro";
    loaderText.textContent = `Integrando escena en ${destName}...`;
    loader.classList.remove("hidden");
    errorBox.classList.add("hidden");

    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          image: capturedDataUrl,
          mode: selectedMode,
          destination: selectedDestination
        })
      });

      const data = await res.json();

      if (!res.ok || !data.image) {
        throw new Error(data.error || "Error al generar la foto");
      }

      generatedDataUrl = await composeMoviePoster(data.image, selectedDestination);
      resultImg.src = generatedDataUrl;
      heading.textContent = `¡Tu Póster en ${destName}!`;
      setStep("ui-done");
    } catch (err) {
      showError("Error: " + err.message);
    } finally {
      loader.classList.add("hidden");
    }
  }

  async function saveToGallery() {
    if (!generatedDataUrl) return;
    const filename = `poster-venezuela-${selectedDestination}-${selectedMode}.jpg`;

    try {
      const response = await fetch(generatedDataUrl);
      const blob = await response.blob();
      const file = new File([blob], filename, { type: "image/jpeg" });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({
          files: [file],
          title: "Venezuela Abierta al Futuro"
        });
        return;
      }
    } catch (err) {
      if (err.name === "AbortError") return;
    }

    const a = document.createElement("a");
    a.href = generatedDataUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  function resetExperience() {
    heading.textContent = "Elige tu encuadre y destino";
    resultImg.classList.add("hidden");
    video.classList.remove("hidden");
    setStep("ui-camera");
  }
</script>

</body>
</html>
