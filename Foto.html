<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Venezuela Abierta al Futuro • Photo Experience</title>
  <style>
    :root {
      --bg: #090b0e;
      --surface: #131720;
      --accent: #f59e0b;
      --accent-hover: #fbbf24;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border-radius: 28px;
      padding: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 18px;
      line-height: 1.3;
    }
    .frame {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 18px;
      border: 1px solid var(--border);
    }
    video, img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    video { transform: scaleX(-1); }
    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--muted);
      font-size: 0.95rem;
      gap: 10px;
    }
    .placeholder svg {
      width: 48px;
      height: 48px;
      stroke: var(--accent);
      opacity: 0.85;
    }
    .hidden { display: none !important; }
    .countdown {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5.5rem;
      font-weight: 800;
      color: #fff;
    }
    .loader {
      position: absolute;
      inset: 0;
      background: rgba(9, 11, 14, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.12);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button, .btn-link {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: block;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    button:active, .btn-link:active { transform: scale(0.98); }
    .btn-primary, .btn-link {
      background: var(--accent);
      color: #000;
    }
    .btn-primary:hover, .btn-link:hover { background: var(--accent-hover); }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }
    .error-msg {
      color: #f87171;
      font-size: 0.85rem;
      margin-top: 8px;
      word-break: break-word;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="badge">Venezuela • Abierta al Futuro</div>
  <h1 id="heading">Viaja a Los Médanos de Coro</h1>

  <div class="frame">
    <div id="placeholder" class="placeholder">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z" />
      </svg>
      <span>Activa tu cámara para tomarte una foto</span>
    </div>

    <video id="video" autoplay playsinline class="hidden"></video>
    <img id="result-img" class="hidden" alt="Resultado">
    <div id="countdown" class="countdown hidden">3</div>

    <div id="loader" class="loader hidden">
      <div class="spinner"></div>
      <p>Generando tu foto en Los Médanos de Coro...</p>
    </div>
  </div>

  <!-- Paso 1 -->
  <div id="ui-start" class="actions">
    <button class="btn-primary" onclick="initCamera()">Activar Cámara</button>
  </div>

  <!-- Paso 2 -->
  <div id="ui-camera" class="actions hidden">
    <button class="btn-primary" onclick="startCountdown()">Tomar Foto</button>
  </div>

  <!-- Paso 3 -->
  <div id="ui-preview" class="actions hidden">
    <button class="btn-primary" onclick="processImage()">Integrar en Médanos de Coro</button>
    <button class="btn-secondary" onclick="retakePhoto()">Repetir Foto</button>
  </div>

  <!-- Paso 4 -->
  <div id="ui-done" class="actions hidden">
    <a id="download-link" class="btn-link" download="medanos-de-coro-venezuela.jpg">Descargar Foto</a>
    <button class="btn-secondary" onclick="resetExperience()">Tomar Otra Foto</button>
  </div>

  <p id="error-box" class="error-msg hidden"></p>
</div>

<canvas id="canvas" class="hidden"></canvas>

<script>
  const WORKER_URL = "https://barbarieentertainment.jesusdavid-chacons.workers.dev";

  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const resultImg = document.getElementById("result-img");
  const placeholder = document.getElementById("placeholder");
  const countdownEl = document.getElementById("countdown");
  const loader = document.getElementById("loader");
  const errorBox = document.getElementById("error-box");
  const downloadLink = document.getElementById("download-link");
  const heading = document.getElementById("heading");

  let capturedDataUrl = null;

  function setStep(step) {
    ["ui-start", "ui-camera", "ui-preview", "ui-done"].forEach(id => {
      document.getElementById(id).classList.add("hidden");
    });
    document.getElementById(step).classList.remove("hidden");
    errorBox.classList.add("hidden");
  }

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.remove("hidden");
  }

  async function initCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 1080 }, height: { ideal: 1440 } },
        audio: false
      });
      video.srcObject = stream;
      placeholder.classList.add("hidden");
      resultImg.classList.add("hidden");
      video.classList.remove("hidden");
      setStep("ui-camera");
    } catch (e) {
      showError("No se pudo abrir la cámara. Asegúrate de dar permiso en el navegador.");
    }
  }

  function startCountdown() {
    let sec = 3;
    countdownEl.textContent = sec;
    countdownEl.classList.remove("hidden");

    const timer = setInterval(() => {
      sec--;
      if (sec > 0) {
        countdownEl.textContent = sec;
      } else {
        clearInterval(timer);
        countdownEl.classList.add("hidden");
        capture();
      }
    }, 1000);
  }

  function capture() {
    const maxW = 1024;
    const scale = Math.min(1, maxW / video.videoWidth);
    canvas.width = video.videoWidth * scale;
    canvas.height = video.videoHeight * scale;

    const ctx = canvas.getContext("2d");
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    capturedDataUrl = canvas.toDataURL("image/jpeg", 0.88);
    resultImg.src = capturedDataUrl;

    video.classList.add("hidden");
    resultImg.classList.remove("hidden");
    setStep("ui-preview");
  }

  function retakePhoto() {
    resultImg.classList.add("hidden");
    video.classList.remove("hidden");
    setStep("ui-camera");
  }

  async function processImage() {
    loader.classList.remove("hidden");
    errorBox.classList.add("hidden");

    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: capturedDataUrl })
      });

      const data = await res.json();

      if (!res.ok || !data.image) {
        throw new Error(data.error || "Error al generar la foto");
      }

      resultImg.src = data.image;
      downloadLink.href = data.image;
      heading.textContent = "¡Ya estás en Los Médanos de Coro!";
      setStep("ui-done");
    } catch (err) {
      showError("Error: " + err.message);
    } finally {
      loader.classList.add("hidden");
    }
  }

  function resetExperience() {
    heading.textContent = "Viaja a Los Médanos de Coro";
    resultImg.classList.add("hidden");
    video.classList.remove("hidden");
    setStep("ui-camera");
  }
</script>

</body>
</html>
