<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Venezuela Abierta al Futuro • Photo Experience</title>
  <style>
    :root {
      --bg: #090b0e;
      --surface: #131720;
      --accent: #f59e0b;
      --accent-hover: #fbbf24;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border-radius: 28px;
      padding: 22px;
      border: 1px solid var(--border);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 14px;
      line-height: 1.3;
    }
    .selectors {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    .pill-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: rgba(0, 0, 0, 0.35);
      padding: 5px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .pill {
      padding: 10px 8px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .pill.active {
      background: var(--accent);
      color: #000;
    }
    .frame {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      transition: aspect-ratio 0.25s ease;
    }
    .frame.group-ratio {
      aspect-ratio: 4 / 3;
    }
    video, img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    video { transform: scaleX(-1); }
    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--muted);
      font-size: 0.92rem;
      gap: 10px;
    }
    .placeholder svg {
      width: 44px;
      height: 44px;
      stroke: var(--accent);
      opacity: 0.85;
    }
    .hidden { display: none !important; }
    .countdown {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5.5rem;
      font-weight: 800;
      color: #fff;
    }
    .loader {
      position: absolute;
      inset: 0;
      background: rgba(9, 11, 14, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.12);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-main, .btn-link {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: block;
      transition: transform 0.12s ease, background 0.15s ease;
      background: var(--accent);
      color: #000;
    }
    .btn-main:active, .btn-link:active { transform: scale(0.98); }
    .btn-main:hover, .btn-link:hover { background: var(--accent-hover); }
    .btn-secondary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }
    .error-msg {
      color: #f87171;
      font-size: 0.85rem;
      margin-top: 8px;
      word-break: break-word;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="badge">Venezuela • Abierta al Futuro</div>
  <h1 id="heading">Elige tu modo y destino</h1>

  <!-- Selectores de Modo y Destino -->
  <div id="selectors" class="selectors">
    <div class="pill-group">
      <button type="button" class="pill active" id="mode-selfie" onclick="setMode('selfie')">Selfie (Individual)</button>
      <button type="button" class="pill" id="mode-group" onclick="setMode('group')">Foto Grupal</button>
    </div>
    <div class="pill-group">
      <button type="button" class="pill active" id="dest-medanos" onclick="setDestination('medanos')">Médanos de Coro</button>
      <button type="button" class="pill" id="dest-salto" onclick="setDestination('salto')">Salto Ángel</button>
    </div>
  </div>

  <div id="frame" class="frame">
    <div id="placeholder" class="placeholder">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z" />
      </svg>
      <span>Activa tu cámara para comenzar</span>
    </div>

    <video id="video" autoplay playsinline class="hidden"></video>
    <img id="result-img" class="hidden" alt="Resultado">
    <div id="countdown" class="countdown hidden">3</div>

    <div id="loader" class="loader hidden">
      <div class="spinner"></div>
      <p id="loader-text">Integrando tu foto...</p>
    </div>
  </div>

  <!-- Paso 1 -->
  <div id="ui-start" class="actions">
    <button class="btn-main" onclick="initCamera()">Activar Cámara</button>
  </div>

  <!-- Paso 2 -->
  <div id="ui-camera" class="actions hidden">
    <button class="btn-main" onclick="startCountdown()">Tomar Foto</button>
  </div>

  <!-- Paso 3 -->
  <div id="ui-preview" class="actions hidden">
    <button id="generate-btn" class="btn-main" onclick="processImage()">Crear Foto en Médanos de Coro</button>
    <button class="btn-secondary" onclick="retakePhoto()">Repetir Foto</button>
  </div>

  <!-- Paso 4 -->
  <div id="ui-done" class="actions hidden">
    <a id="download-link" class="btn-link" download="venezuela-marca-pais.jpg">Descargar Foto</a>
    <button class="btn-secondary" onclick="resetExperience()">Tomar Otra Foto</button>
  </div>

  <p id="error-box" class="error-msg hidden"></p>
</div>

<canvas id="canvas" class="hidden"></canvas>

<script>
  const WORKER_URL = "https://barbarieentertainment.jesusdavid-chacons.workers.dev";

  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const resultImg = document.getElementById("result-img");
  const placeholder = document.getElementById("placeholder");
  const countdownEl = document.getElementById("countdown");
  const loader = document.getElementById("loader");
  const loaderText = document.getElementById("loader-text");
  const errorBox = document.getElementById("error-box");
  const downloadLink = document.getElementById("download-link");
  const heading = document.getElementById("heading");
  const frame = document.getElementById("frame");
  const generateBtn = document.getElementById("generate-btn");
  const selectors = document.getElementById("selectors");

  let selectedMode = "selfie";
  let selectedDestination = "medanos";
  let capturedDataUrl = null;

  function setMode(mode) {
    selectedMode = mode;
    document.getElementById("mode-selfie").classList.toggle("active", mode === "selfie");
    document.getElementById("mode-group").classList.toggle("active", mode === "group");
    frame.classList.toggle("group-ratio", mode === "group");
  }

  function setDestination(dest) {
    selectedDestination = dest;
    document.getElementById("dest-medanos").classList.toggle("active", dest === "medanos");
    document.getElementById("dest-salto").classList.toggle("active", dest === "salto");
    const destName = dest === "salto" ? "Salto Ángel" : "Médanos de Coro";
    generateBtn.textContent = `Crear Foto en ${destName}`;
  }

  function setStep(step) {
    ["ui-start", "ui-camera", "ui-preview", "ui-done"].forEach(id => {
      document.getElementById(id).classList.add("hidden");
    });
    document.getElementById(step).classList.remove("hidden");
    selectors.classList.toggle("hidden", step === "ui-done");
    errorBox.classList.add("hidden");
  }

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.remove("hidden");
  }

  async function initCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 1280 } },
        audio: false
      });
      video.srcObject = stream;
      placeholder.classList.add("hidden");
      resultImg.classList.add("hidden");
      video.classList.remove("hidden");
      setStep("ui-camera");
    } catch (e) {
      showError("No se pudo abrir la cámara. Verifica los permisos del navegador.");
    }
  }

  function startCountdown() {
    let sec = 3;
    countdownEl.textContent = sec;
    countdownEl.classList.remove("hidden");

    const timer = setInterval(() => {
      sec--;
      if (sec > 0) {
        countdownEl.textContent = sec;
      } else {
        clearInterval(timer);
        countdownEl.classList.add("hidden");
        capture();
      }
    }, 1000);
  }

  function capture() {
    // Recortar exactamente al encuadre visible (3:4 para selfie, 4:3 para grupal)
    const targetRatio = selectedMode === "group" ? 4 / 3 : 3 / 4;
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    const videoRatio = vw / vh;

    let sx = 0, sy = 0, sw = vw, sh = vh;
    if (videoRatio > targetRatio) {
      sw = vh * targetRatio;
      sx = (vw - sw) / 2;
    } else {
      sh = vw / targetRatio;
      sy = (vh - sh) / 2;
    }

    const maxDim = 1152;
    if (sw >= sh) {
      canvas.width = Math.min(maxDim, sw);
      canvas.height = canvas.width / targetRatio;
    } else {
      canvas.height = Math.min(maxDim, sh);
      canvas.width = canvas.height * targetRatio;
    }

    const ctx = canvas.getContext("2d");
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

    capturedDataUrl = canvas.toDataURL("image/jpeg", 0.9);
    resultImg.src = capturedDataUrl;

    video.classList.add("hidden");
    resultImg.classList.remove("hidden");
    setStep("ui-preview");
  }

  function retakePhoto() {
    resultImg.classList.add("hidden");
    video.classList.remove("hidden");
    setStep("ui-camera");
  }

  async function processImage() {
    const destName = selectedDestination === "salto" ? "el Salto Ángel" : "Los Médanos de Coro";
    loaderText.textContent = `Integrando en ${destName}...`;
    loader.classList.remove("hidden");
    errorBox.classList.add("hidden");

    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          image: capturedDataUrl,
          mode: selectedMode,
          destination: selectedDestination
        })
      });

      const data = await res.json();

      if (!res.ok || !data.image) {
        throw new Error(data.error || "Error al generar la foto");
      }

      resultImg.src = data.image;
      downloadLink.href = data.image;
      downloadLink.download = `venezuela-${selectedDestination}-${selectedMode}.jpg`;
      heading.textContent = `¡Tu recuerdo en ${destName}!`;
      setStep("ui-done");
    } catch (err) {
      showError("Error: " + err.message);
    } finally {
      loader.classList.add("hidden");
    }
  }

  function resetExperience() {
    heading.textContent = "Elige tu modo y destino";
    resultImg.classList.add("hidden");
    video.classList.remove("hidden");
    setStep("ui-camera");
  }
</script>

</body>
</html>
